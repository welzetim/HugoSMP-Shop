<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>HugoSMP Market</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #2a004f, #6a008a, #000000);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
    }

    .title-box {
      background: linear-gradient(135deg, #ff4ecb, #8a2be2);
      color: black;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin: 10px 0;
    }

    .highlight {
      color: #ff4ecb;
    }

    p {
      color: #ccc;
      margin-top: 15px;
    }

    .features {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .feature {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px;
      border-radius: 10px;
      width: 150px;
    }

    .feature b {
      color: #ff4ecb;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 25px;
      background: linear-gradient(90deg, #ff4ecb, #8a2be2);
      color: black;
      font-weight: bold;
      text-decoration: none;
      border-radius: 12px;
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.05);
      filter: brightness(1.1);
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="title-box">HUGOSMP MARKET</div>

    <h1>
      Dein zuverlässiger <span class="highlight">Minecraft Market</span>
    </h1>

    <p>
      Schnelle Lieferung, faire Deals und direkter Support über Discord.
    </p>

    <div class="features">
      <div class="feature">
        <b>Schnell</b>
        <p>Direkter Support</p>
      </div>

      <div class="feature">
        <b>Fair</b>
        <p>Gute Preise</p>
      </div>

      <div class="feature">
        <b>Aktiv</b>
        <p>Community & Deals</p>
      </div>
    </div>

    <a href="https://discord.gg/meQda4y6u" target="_blank" class="button">
      Zum Shop
    </a>

    <div class="footer">
      Kein offizieller HugoSMP Server • Handel auf eigenes Risiko
    </div>
  </div>
</body>
</html>
